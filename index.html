<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚽ 足球资讯</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="menu-btn" id="menuBtn" aria-label="日期列表">☰</button>
      <div class="brand">
        <span class="logo">⚽</span>
        <div>
          <h1>足球资讯</h1>
          <p class="sub" id="updated">加载中…</p>
        </div>
      </div>
      <div class="search">
        <input id="search" type="search" placeholder="搜索球星、名宿或关键词…" />
      </div>
    </div>
    <nav class="channel-bar" id="channelBar" aria-label="频道导航"></nav>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h2>日期归档</h2>
      <ul id="dateList" class="date-list"></ul>
    </aside>

    <main class="main">
      <div class="day-head">
        <h2 id="dayTitle">—</h2>
        <span class="day-count" id="dayCount"></span>
      </div>
      <section class="grid" id="list"></section>
      <p class="empty" id="empty" hidden>这个频道今天没有内容</p>
    </main>
  </div>

  <div class="lightbox" id="lightbox" hidden>
    <img id="lightboxImg" alt="大图预览" />
  </div>
  <script src="assets/app.js"></script>
</body>
</html>
